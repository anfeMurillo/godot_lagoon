; Lagoonic Engine — ajustes por defecto propios (v1 sobre Godot 4.7.2-stable).
; Fichero NUEVO de configuracion: no cambia ningun default de Godot.
; Quien lo aplica (scripts de build, app Android/iOS/desktop) copia cada clave
; a su sitio oficial SIN tocar el corazon del motor:
;
;   [editor_settings] -> EditorSettings del usuario
;     (p. ej. ~/.config/godot/editor_settings-4.7.tres en Linux,
;      ~/Library/Application Support/Godot/editor_settings-4.7.tres en macOS;
;      en Android, GodotLib.setEditorSetting() con las mismas claves).
;     Ver NOTAS.md de esta carpeta para las lineas exactas del .tres.
;   [project] -> seccion [lagoonic] de project.godot, SOLO si el proyecto
;     usa funciones lagoonic/* (opt-in). Un proyecto que no la usa sigue
;     siendo un proyecto Godot normal byte a byte.
;
; Paleta: extraida de assets/branding/logo.png (ver NOTAS.md).
;   acento agua  #009ce0 -> Color(0, 0.612, 0.878, 1)
;   base laguna  #1b2b22 -> Color(0.106, 0.169, 0.133, 1)

[editor_settings]

; Tema de color Lagoonic. color_preset DEBE ser "Custom": con cualquier otro
; valor, EditorThemeManager sobrescribe base_color/accent_color con el preset
; (editor/themes/editor_theme_manager.cpp) e ignora estos colores.
interface/theme/color_preset="Custom"
interface/theme/base_color=Color(0.106, 0.169, 0.133, 1)
interface/theme/accent_color=Color(0, 0.612, 0.878, 1)
interface/theme/contrast=0.3

; Puente Lagoonic (MCP/editor) activado por defecto. La clave la REGISTRA el
; modulo/addon Lagoonic (modules/lagoonic/ o addons/lagoonic, de otro agente);
; este fichero solo fija su valor por defecto. Prefijo lagoonic/ reservado:
; nunca colisiona con claves oficiales presentes ni futuras.
lagoonic/bridge/enabled=true

[project]

; Override opt-in por proyecto (solo se escribe si el proyecto usa Lagoonic).
; En project.godot va bajo la seccion [lagoonic], que Godot oficial conserva
; tal cual al abrir/guardar (round-trip limpio fuera de lagoonic/*).
lagoonic/bridge/enabled=true
